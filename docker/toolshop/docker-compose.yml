# Runs the application under test locally from the prebuilt images published by its authors
# (github.com/testsmith-io/practice-software-testing). CI uses it because the hosted demo sits
# behind a Cloudflare bot check that blocks GitHub Actions runners.
#   UI:  http://localhost:4200
#   API: http://localhost:8091
services:
  laravel-api:
    image: testsmith/practice-software-testing-sprint5-api:2.5
    environment:
      - PHP_OPCACHE_VALIDATE_TIMESTAMPS=1
      - DB_PORT=3306
      - DB_HOST=mariadb
      - host=localhost
      - DISABLE_LOGGING=true
    volumes:
      - laravel-app-code:/var/www
    depends_on:
      - mariadb

  angular-ui:
    image: testsmith/practice-software-testing-sprint5-ui:2.5
    ports:
      - 4200:4200
    command: bash -c "ng serve --host 0.0.0.0 --port 4200"

  # The published web image is arm64-only, so the API is served by the official nginx image
  # with the app's own vhost config instead
  web:
    image: nginx:1.27-alpine
    volumes:
      - laravel-app-code:/var/www
      - ./vhost.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - 8091:80
    depends_on:
      - laravel-api

  mariadb:
    image: yobasystems/alpine-mariadb:10.6.11
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_USER: user
      MYSQL_PASSWORD: root
      MYSQL_DATABASE: toolshop

volumes:
  laravel-app-code:
